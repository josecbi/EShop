<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Echop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="announcement">New deals every week <span aria-hidden="true">&middot;</span> Free shipping on select orders</div>
    <header class="auth-header">
        <a class="wordmark" href="/" aria-label="Echop, home">Echop<span>.</span></a>
        <a class="back-to-shop" href="/">Back to shop <span aria-hidden="true">&rarr;</span></a>
    </header>
    <main class="auth-main">
        <div class="card">
            <p class="eyebrow">Echop / Your account</p>
            <form id="login-form" method="post">
                <h1>User Login</h1>

                <div id="message-container" class="message"></div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"
                        title="Email is required" />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                        placeholder="input your password" title="Password is required" />
                </div>

                <div class="options">
                    <label class="checkbox">
                        <input id="remember" name="remember" type="checkbox" />
                        Remember me
                    </label>
                    <a class="forgot" href="/auth/forgot-password.html">Forgot Password?</a>
                </div>

                <div class="actions">
                    <button type="submit">Login</button>
                </div>
            </form>

            <div class="actions secondary-action">
                <a href="/auth/signup.html" class="signup-link">SIGNUP</a>
            </div>
        </div>
    </main>
    <script src="login.js" type="module"></script>
</body>

</html>
