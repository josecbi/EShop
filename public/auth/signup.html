<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Echop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="announcement">New deals every week <span aria-hidden="true">&middot;</span> Free shipping on select orders</div>
    <header class="auth-header">
        <a class="wordmark" href="/" aria-label="Echop, home">Echop<span>.</span></a>
        <a class="back-to-shop" href="/">Back to shop <span aria-hidden="true">&rarr;</span></a>
    </header>
    <main class="auth-main">
        <div class="card">
            <p class="eyebrow">Echop / Your account</p>
            <form id="signup-form" method="post">
                <h1>Create Account</h1>

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" required autocomplete="username"
                        placeholder="choose a username" title="Username is required" />
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"
                        title="A valid email is required" />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="new-password"
                        placeholder="create a password" title="Password is required" />
                </div>

                <div class="options">
                    <label class="checkbox">
                        <input id="agree" name="agree" type="checkbox" required />
                        I agree to the terms
                    </label>
                </div>

                <div id="message" class="message"></div>

                <div class="actions">
                    <button type="submit">Sign Up</button>
                </div>
            </form>

            <div class="actions secondary-action">
                <a href="/auth/login.html" class="login-link">ALREADY HAVE AN ACCOUNT? LOGIN</a>
            </div>
        </div>
    </main>
    <script src="signup.js" type="module"></script>
</body>

</html>
