<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="announcement">New deals every week <span aria-hidden="true">&middot;</span> Free shipping on select orders</div>
    <header class="auth-header">
        <a class="wordmark" href="/" aria-label="Echop, home">Echop<span>.</span></a>
        <a class="back-to-shop" href="/">Back to shop <span aria-hidden="true">&rarr;</span></a>
    </header>
    <main class="auth-main">
        <div class="card">
            <p class="eyebrow">Echop / Your account</p>
            <form id="reset-password-form" method="post">
                <h1>Reset Password</h1>

                <div id="message-container" class="message"></div>

                <div class="field">
                    <label for="new-password">New Password</label>
                    <input id="new-password" name="new-password" type="password" required autocomplete="new-password"
                        placeholder="Enter new password" title="Password is required" />
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" name="confirm-password" type="password" required
                        autocomplete="new-password" placeholder="Confirm your password" title="Passwords must match" />
                </div>

                <div class="actions">
                    <button type="submit">Reset Password</button>
                </div>
            </form>

            <div class="actions secondary-action">
                <a href="/auth/login.html" class="signup-link">Back to Login</a>
            </div>
        </div>
    </main>
    <script src="reset-password.js" type="module"></script>
</body>

</html>
